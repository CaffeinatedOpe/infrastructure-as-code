---
apiVersion: v1
kind: Namespace
metadata:
  name: eng
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eng
  namespace: eng
spec:
  interval: 5m
  path: ./cluster/publicFacing/eng
  prune: true
  sourceRef:
    kind: GitRepository
    namespace: flux-system
    name: flux-system