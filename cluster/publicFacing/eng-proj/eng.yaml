apiVersion: apps/v1
kind: Deployment
metadata:
  name: eng-deployment
  namespace: eng
spec:
  replicas: 2
  selector:
    matchLabels:
      app: eng
  template:
    metadata:
      labels:
        app: eng
    spec:
      containers:
      - name: eng
        image: codeberg.org/caffeinatedope/eng-proj:latest@sha256:078c53bb915e41c2b29d0d26c6e6dabb349e24639f6e3e187f3cb7412d5db79b # {"$imagepolicy": "eng:eng-imagepolicy"}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4321
